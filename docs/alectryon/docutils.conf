# Docutils settings for the Alectryon → LaTeX pipeline.
# Loaded automatically when Alectryon is run from this directory.

[general]
halt_level: 5
report_level: 2

[latex2e writer]
documentclass: article
documentoptions: 11pt,a4paper

[xetex writer]
documentclass: article
documentoptions: 11pt,a4paper
latex-preamble:
 \usepackage{unicode-math}
 \setmonofont{DejaVu Sans Mono}[Scale=0.85]
 \usepackage[margin=1in]{geometry}
 \usepackage{microtype}
 \emergencystretch=3em
 \sloppy
 \usepackage{hyperref}
 \hypersetup{colorlinks=true,linkcolor=blue!50!black,urlcolor=blue!50!black,
   pdftitle={Machine-checked proofs of ac-LEEM Fourier-optics identities},
   pdfauthor={Wilson Lau}}

[lualatex writer]
documentclass: article
documentoptions: 11pt,a4paper
latex-preamble:
 \usepackage{unicode-math}
 \setmonofont{DejaVu Sans Mono}[Scale=0.85]
 \usepackage[margin=1in]{geometry}
 \usepackage{microtype}
 \emergencystretch=3em
 \sloppy
 \usepackage{hyperref}
 \hypersetup{colorlinks=true,linkcolor=blue!50!black,urlcolor=blue!50!black,
   pdftitle={Machine-checked proofs of ac-LEEM Fourier-optics identities},
   pdfauthor={Wilson Lau}}
